<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>INK DREAM — сон-головоломка</title>
<style>
  :root { --paper:#EFEEE8; --ink:#22231F; --muted:#75776F; --line:#C6C8C0; --panel:#E5E4DD; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body {
    background:var(--paper); color:var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    -webkit-user-select:none; user-select:none;
  }
  #wrap { width:100%; max-width:1000px; padding:10px 12px 24px; }
  #topbar { display:flex; align-items:baseline; justify-content:space-between; padding:6px 4px; }
  #ttl { font-size:15px; letter-spacing:.28em; }
  #zonelabel { font-size:13px; letter-spacing:.18em; color:var(--muted); }
  #stagebox { position:relative; border:1px solid var(--ink); background:var(--paper); }
  svg#stage { display:block; width:100%; height:auto; touch-action:none; }

  /* ink drawing defaults */
  .ink { stroke:var(--ink); fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
  .fillink { fill:var(--ink); stroke:none; }
  .thin { stroke-width:1.4; }
  .piece { cursor:grab; }
  .piece.drag { cursor:grabbing; }
  .piece.placed { cursor:default; }
  .clicky { cursor:pointer; }
  .hiddenEl { display:none !important; }
  .ghost { stroke:var(--muted); stroke-dasharray:4 6; fill:none; stroke-width:1.6; animation:ghostfade 4s forwards; }
  @keyframes ghostfade { 0%{opacity:0} 12%{opacity:.9} 80%{opacity:.9} 100%{opacity:0} }

  .letterReveal path { stroke:var(--ink); fill:none; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
  .letterReveal.draw path { stroke-dasharray:300; stroke-dashoffset:300; animation:drawpath 1.1s ease forwards; }
  @keyframes drawpath { to { stroke-dashoffset:0; } }

  .doorleaf { transform-box:fill-box; transform-origin:left center; transition:transform 1.1s ease; }
  .gate.open .doorleaf { transform:rotate(-72deg); }
  .cupdoor { transition:opacity 1s ease; }
  .opencup .cupdoor { opacity:0; pointer-events:none; }

  /* HUD */
  #hud { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; flex-wrap:wrap; }
  #tray { display:flex; gap:6px; min-height:40px; align-items:center; flex-wrap:wrap; }
  .chip {
    width:36px; height:36px; border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center;
    font-size:20px; background:var(--panel); animation:pop .35s ease;
  }
  @keyframes pop { 0%{transform:scale(.2)} 70%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .btn {
    font-family:inherit; font-size:14px; letter-spacing:.06em; padding:8px 14px;
    background:var(--paper); color:var(--ink); border:1.5px solid var(--ink); cursor:pointer;
  }
  .btn:disabled { opacity:.35; cursor:default; }
  .btn:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  #navRow { display:flex; gap:8px; }

  /* overlays */
  .overlay {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
  }
  .card {
    background:var(--paper); border:1.5px solid var(--ink); padding:28px 32px; max-width:420px; width:min(92%,420px);
    text-align:center; box-shadow:6px 6px 0 color-mix(in srgb, var(--ink) 12%, transparent);
  }
  .card h1 { margin:0 0 4px; font-size:30px; letter-spacing:.3em; font-weight:400; }
  .card .sub { color:var(--muted); font-size:14px; margin:0 0 18px; }
  .card p { font-size:14px; line-height:1.6; margin:0 0 16px; }
  #panelSlots { display:flex; gap:8px; justify-content:center; margin:14px 0 18px; }
  .slot { width:44px; height:52px; border:1.5px solid var(--ink); font-size:26px; display:flex; align-items:center; justify-content:center; background:var(--panel); }
  #panelGrid { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-bottom:14px; }
  .key { padding:10px 0; border:1px solid var(--ink); background:var(--paper); font-size:18px; cursor:pointer; font-family:inherit; }
  .key.have { background:var(--panel); box-shadow:inset 0 0 0 1px var(--ink); }
  .shake { animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  @media (prefers-reduced-motion: reduce) {
    .letterReveal.draw path { animation:none; stroke-dashoffset:0; }
    .chip { animation:none; }
  }
</style>
</head>

  <!-- intro overlay -->
  <div id="intro" class="overlay">
    <div class="card">

      <p class="sub">сон-головоломка · чернила на бумаге</p>
      <p>Тяни предметы и совмещай их — верное наложение проявит букву.<br>

    <div id="navRow">

      <button class="btn" id="prevBtn" disabled>‹</button>

</div>

<script>

};
var PUZZLES = {

  p2:{zone:0, letter:'U', pieces:['p2a','p2b','p2c']},

var DISCS = { d1:{cur:3, goal:0, cy:176}, d2:{cur:1, goal:4, cy:246}, d3:{cur:5, goal:2, cy:316} };
var CODES = ['SUN','KEY','END'];
var GRID  = ['S','U','N','K','E','Y','D','A','M','O','R','T'];
var ZONES = ['I · ДЕРЕВО','II · КОМНАТА','III · ОЗЕРО'];

var S = { zone:0, solved:[], gates:[false,false,false], sprouted:[], start:Date.now(), zoneEnter:Date.now() };

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function el(id){ return document.getElementById(id); }
function setPos(id, x, y){ el(id).setAttribute('transform','translate('+x+' '+y+')'); PIECES[id].cx = x; PIECES[id].cy = y; }
function svgPoint(evt){
  var pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function dist(ax,ay,bx,by){ var dx=ax-bx, dy=ay-by; return Math.sqrt(dx*dx+dy*dy); }
function save(){
  try { localStorage.setItem('inkdream', JSON.stringify({v:1, solved:S.solved, gates:S.gates, zone:S.zone, start:S.start})); } catch(e){}
}
function loadSave(){
  try { return JSON.parse(localStorage.getItem('inkdream')||'null'); } catch(e){ return null; }
}

/* ---------- audio ---------- */
var AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f, dur, type, gain, delay){
  var ac = audio(); if(!ac) return;
  var t = ac.currentTime + (delay||0);
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type||'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain||0.05, t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t+dur+0.05);
}
var snd = {
  click: function(){ tone(760,0.04,'square',0.015); },
  snap:  function(){ tone(520,0.09,'triangle',0.05); tone(780,0.12,'triangle',0.04,0.05); },
  letter:function(){ tone(660,0.18,'sine',0.06); tone(990,0.25,'sine',0.05,0.12); },
  gate:  function(){ tone(196,0.5,'sine',0.07); tone(294,0.6,'sine',0.05,0.1); tone(392,0.7,'sine',0.04,0.2); },
  wrong: function(){ tone(150,0.2,'sawtooth',0.03); }
};

/* ---------- init pieces ---------- */
Object.keys(PIECES).forEach(function(id){
  var d = PIECES[id];
  setPos(id, d.x, d.y);
  if(d.hidden) el(id).classList.add('hiddenEl');
});

/* ---------- drag ---------- */
var dragId = null, dragOff = {x:0,y:0};
svg.addEventListener('pointerdown', function(evt){
  var g = evt.target.closest ? evt.target.closest('.piece') : null;
  if(!g || g.classList.contains('placed') || g.classList.contains('hiddenEl')) return;
  var id = g.id, d = PIECES[id];
  if(!d || d.placed) return;
  dragId = id;
  var p = svgPoint(evt);
  dragOff.x = p.x - d.cx; dragOff.y = p.y - d.cy;
  g.classList.add('drag');
  try { svg.setPointerCapture(evt.pointerId); } catch(e){}
  snd.click();
  evt.preventDefault();
});
svg.addEventListener('pointermove', function(evt){
  if(!dragId) return;
  var p = svgPoint(evt);
  setPos(dragId, p.x - dragOff.x, p.y - dragOff.y);
});
svg.addEventListener('pointerup', function(evt){
  if(!dragId) return;
  var id = dragId; dragId = null;
  el(id).classList.remove('drag');
  var d = PIECES[id];
  var ok = dist(d.cx, d.cy, d.tx, d.ty) < TOL;
  if(ok && d.req && !PIECES[d.req].placed) ok = false;
  if(ok) placePiece(id, false);
});

function placePiece(id, silent){
  var d = PIECES[id];
  if(d.placed) return;
  d.placed = true;
  setPos(id, d.tx, d.ty);
  var g = el(id);
  g.classList.add('placed');
  g.classList.remove('hiddenEl');
  if(!silent) snd.snap();
  /* special hooks */
  if(id === 'p4twig'){
    g.classList.add('hiddenEl');
    el('spoon').classList.add('hiddenEl');
    var k = el('p4key');
    k.classList.remove('hiddenEl');
    PIECES.p4key.placed = false;
    setPos('p4key', PIECES.p4key.x, PIECES.p4key.y);
  }
  if(id === 'p4key'){
    g.classList.add('hiddenEl');
    el('cupboard').classList.add('opencup');
    setTimeout(function(){ el('L_p4').classList.remove('hiddenEl'); }, silent?0:600);
  }
  if(id === 'p7m'){ el('reflection').classList.remove('hiddenEl'); }
  if(id === 'p9h'){ el('p9twin').classList.remove('hiddenEl'); }
  checkPuzzle(d.p, silent);
}

/* ---------- discs ---------- */
function rotDisc(id){
  var D = DISCS[id];
  el(id+'r').setAttribute('transform', 'rotate(' + (D.cur*60) + ' 320 ' + D.cy + ')');
}
['d1','d2','d3'].forEach(function(id){
  el(id).addEventListener('click', function(){
    if(S.solved.indexOf('p5') >= 0) return;
    var D = DISCS[id];
    D.cur = (D.cur + 1) % 6;
    rotDisc(id);
    snd.click();
    checkPuzzle('p5', false);
  });
});
function discsOk(){ return ['d1','d2','d3'].every(function(k){ return DISCS[k].cur === DISCS[k].goal; }); }
/* apply initial disc rotation */
['d1','d2','d3'].forEach(rotDisc);

/* ---------- stubs (sprout leaves) ---------- */
['p3a','p3b','p3c'].forEach(function(id){
  el('stub_'+id).addEventListener('click', function(){
    if(S.sprouted.indexOf(id) >= 0) return;
    S.sprouted.push(id);
    el(id).classList.remove('hiddenEl');
    this.style.fill = 'var(--ink)';
    snd.snap();
  });
});

/* ---------- puzzles ---------- */
function checkPuzzle(pid, silent){
  if(S.solved.indexOf(pid) >= 0) return;
  var P = PUZZLES[pid];
  var done = P.discs ? discsOk() : P.pieces.every(function(id){ return PIECES[id].placed; });
  if(!done) return;
  S.solved.push(pid);
  P.pieces.forEach(function(id){ el(id).classList.add('placed'); });
  var L = el('L_'+pid);
  if(L){
    L.classList.remove('hiddenEl');
    if(!silent) L.classList.add('draw');
  }
  addChip(P.letter, silent);
  if(!silent) snd.letter();
  save();
}
function addChip(letter, silent){
  var c = document.createElement('div');
  c.className = 'chip';
  if(silent) c.style.animation = 'none';
  c.textContent = letter;
  $('tray').appendChild(c);
}

/* ---------- gates & code panel ---------- */
var panelZone = -1, entered = [];
[0,1,2].forEach(function(z){
  el('gate'+z).addEventListener('click', function(){
    if(S.gates[z]) return;
    openPanel(z);
  });
});
function openPanel(z){
  panelZone = z; entered = [];
  renderSlots();
  var grid = $('panelGrid'); grid.innerHTML = '';
  var collected = S.solved.map(function(pid){ return PUZZLES[pid].letter; });
  GRID.forEach(function(ch){
    var b = document.createElement('button');
    b.className = 'key' + (collected.indexOf(ch) >= 0 ? ' have' : '');
    b.textContent = ch;
    b.addEventListener('click', function(){
      if(entered.length >= CODES[panelZone].length) return;
      entered.push(ch); snd.click(); renderSlots();
      if(entered.length === CODES[panelZone].length) setTimeout(checkCode, 250);
    });
    grid.appendChild(b);
  });
  $('panel').classList.remove('hiddenEl');
}
function renderSlots(){
  var s = $('panelSlots'); s.innerHTML = '';
  for(var i=0;i<CODES[panelZone].length;i++){
    var d = document.createElement('div');
    d.className = 'slot';
    d.textContent = entered[i] || '';
    s.appendChild(d);
  }
}
function checkCode(){
  if(entered.join('') === CODES[panelZone]){
    S.gates[panelZone] = true;
    $('panel').classList.add('hiddenEl');
    el('gate'+panelZone).classList.add('open');
    snd.gate();
    save();
    if(panelZone === 2){ setTimeout(showFinale, 1400); }
    else { setTimeout(function(){ gotoZone(panelZone+1); }, 1200); }
  } else {
    snd.wrong();
    entered = [];
    renderSlots();
    $('panelCard').classList.add('shake');
    setTimeout(function(){ $('panelCard').classList.remove('shake'); }, 450);
  }
  updateNav();
}
$('panelClear').addEventListener('click', function(){ entered = []; renderSlots(); });
$('panelClose').addEventListener('click', function(){ $('panel').classList.add('hiddenEl'); });

/* ---------- zones / nav ---------- */
function gotoZone(z){
  S.zone = z; S.zoneEnter = Date.now();
  [0,1,2].forEach(function(i){ el('zone'+i).style.display = (i===z ? '' : 'none'); });
  $('zonelabel').textContent = ZONES[z];
  $('solveBtn').classList.add('hiddenEl');
  updateNav(); save();
}
function updateNav(){
  $('prevBtn').disabled = (S.zone === 0);
  $('nextBtn').disabled = !(S.zone < 2 && S.gates[S.zone]);
}
$('prevBtn').addEventListener('click', function(){ if(S.zone>0) gotoZone(S.zone-1); });
$('nextBtn').addEventListener('click', function(){ if(S.zone<2 && S.gates[S.zone]) gotoZone(S.zone+1); });

/* ---------- hints ---------- */
$('hintBtn').addEventListener('click', function(){
  var layer = $('ghosts'); layer.innerHTML = '';
  var any = false;
  Object.keys(PIECES).forEach(function(id){
    var d = PIECES[id];
    if(PUZZLES[d.p].zone !== S.zone || d.placed) return;
    if(el(id).classList.contains('hiddenEl') && id.indexOf('p3') === 0){
      /* leaf not sprouted yet: ghost the stub */
      var st = el('stub_'+id);
      if(st){ ghostAt(+st.getAttribute('cx'), +st.getAttribute('cy'), 14); any = true; }
      return;
    }
    if(el(id).classList.contains('hiddenEl')) return;
    ghostAt(d.tx, d.ty, 30); any = true;
  });
  if(S.zone === 1 && S.solved.indexOf('p5') < 0){ ghostAt(320, 246, 48); any = true; }
  if(!any){ /* everything solved: ghost the gate */ ghostAt(S.zone===0?614:(S.zone===1?916:560), 430, 40); }
  snd.click();
  /* after 90s in a zone, offer auto-solve */
  if(Date.now() - S.zoneEnter > 90000) $('solveBtn').classList.remove('hiddenEl');
});
function ghostAt(x,y,r){
  var c = document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',r);
  c.setAttribute('class','ghost');
  $('ghosts').appendChild(c);
  setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); }, 4200);
}
$('solveBtn').addEventListener('click', function(){
  var pid = Object.keys(PUZZLES).find(function(k){ return PUZZLES[k].zone === S.zone && S.solved.indexOf(k) < 0; });
  if(pid) autoSolve(pid, false);
});

/* ---------- auto-solve (also used to restore saves) ---------- */
function autoSolve(pid, silent){
  var P = PUZZLES[pid];
  if(P.sprout){
    P.pieces.forEach(function(id){
      if(S.sprouted.indexOf(id) < 0){ S.sprouted.push(id); }
      el(id).classList.remove('hiddenEl');
      var st = el('stub_'+id); if(st) st.style.fill = 'var(--ink)';
    });
  }
  if(P.discs){
    ['d1','d2','d3'].forEach(function(k){ DISCS[k].cur = DISCS[k].goal; rotDisc(k); });
    checkPuzzle('p5', silent);
    return;
  }
  P.pieces.forEach(function(id){ placePiece(id, silent); });
}

/* ---------- finale ---------- */
function showFinale(){
  var mins = Math.max(1, Math.round((Date.now() - S.start)/60000));
  $('finTime').textContent = 'сон длился ~' + mins + ' мин';
  $('finale').classList.remove('hiddenEl');
}
$('againBtn').addEventListener('click', function(){
  try { localStorage.removeItem('inkdream'); } catch(e){}
  location.reload();
});

/* ---------- intro / restore ---------- */
var sv = loadSave();
if(sv && sv.solved && sv.solved.length){ $('contBtn').classList.remove('hiddenEl'); }
$('startBtn').addEventListener('click', function(){
  try { localStorage.removeItem('inkdream'); } catch(e){}
  audio(); $('intro').classList.add('hiddenEl');
  S.start = Date.now(); gotoZone(0); save();
});
$('contBtn').addEventListener('click', function(){
  audio(); $('intro').classList.add('hiddenEl');
  S.start = sv.start || Date.now();
  sv.solved.forEach(function(pid){ if(PUZZLES[pid]) autoSolve(pid, true); });
  S.gates = sv.gates || [false,false,false];
  [0,1,2].forEach(function(z){ if(S.gates[z]) el('gate'+z).classList.add('open'); });
  gotoZone(Math.min(sv.zone||0, 2));
});
gotoZone(0);
})();
</script>
</body>
</html>
